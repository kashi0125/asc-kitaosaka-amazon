<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>北大阪 発送状況</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
:root{
  --bg:#f3f4f1; --card:#fff; --ink:#1d2320; --sub:#69716c; --line:#dfe3dd;
  --accent:#1f6f5c; --accent-soft:#e1efe9; --warn:#b5651d; --warn-soft:#f8ead9;
  --danger:#b3261e; --done:#2e7d32; --done-soft:#e3f1e4; --mid:#1d5fa8; --mid-soft:#e2ecf8;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121614; --card:#1c2220; --ink:#e7ece9; --sub:#9aa39e; --line:#2d3532;
    --accent:#5fc0a4; --accent-soft:#1f3a32; --warn:#e3a35f; --warn-soft:#3b2c1c;

}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 96px}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.hrow{max-width:728px;margin:0 auto;display:flex;align-items:center;gap:8px}
h1{font-size:17px;margin:0;flex:1;letter-spacing:.02em}
.status{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.status.err{background:var(--warn-soft);color:var(--danger)}
.datebar{max-width:728px;margin:8px auto 0;display:flex;gap:6px;align-items:center}
.datebar input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);min-width:0}
.halfseg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);flex:none}
.halfseg button{border:0;background:transparent;padding:8px 10px;cursor:pointer;color:var(--sub)}
.halfseg button.on{background:var(--accent);color:#fff;font-weight:600}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer}
.tabs{max-width:728px;margin:10px auto 0;display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--sub)}
.tabs button.on{background:var(--accent);color:#fff;font-weight:600}
.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.sec{font-size:13px;color:var(--sub);margin:18px 2px 8px;font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lbl{font-size:11px;color:var(--sub);display:block;margin-bottom:3px}
.fld{flex:1;min-width:0}
.inp{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:transparent}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea.inp{min-height:110px;resize:vertical}
.badge{font-size:20px;font-weight:700;color:var(--accent);width:32px;text-align:center}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .2s}
.small{font-size:12px;color:var(--sub)}
.floorhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.floor{font-weight:700;font-size:16px;min-width:44px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:var(--bg);width:36px;height:36px;font-size:18px;cursor:pointer}
.stepper input{width:56px;border:0;text-align:center;height:36px;background:transparent}
.toggle{flex:1;border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 6px;cursor:pointer;font-size:13px;min-width:0}
.toggle.on{background:var(--done-soft);border-color:var(--done);color:var(--done);font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:1}
.seg button{flex:1;border:0;background:transparent;padding:6px 2px;min-height:44px;cursor:pointer;font-size:13px;line-height:1.25}
.seg button+button{border-left:1px solid var(--line)}
.seg .s0{background:var(--line);font-weight:600}
.seg .s1{background:var(--mid-soft);color:var(--mid);font-weight:600}
.seg .s2{background:var(--warn-soft);color:var(--warn);font-weight:600}
.seg .s3{background:var(--done-soft);color:var(--done);font-weight:600}
.tel{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;font-size:18px;flex:none}
.tel.off{background:var(--line);pointer-events:none}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;border:0;background:var(--accent);color:#fff;padding:12px 20px;border-radius:99px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer}
.err{color:var(--danger);font-size:13px;margin-top:8px}
.demo{background:var(--warn-soft);color:var(--warn);font-size:12px;padding:8px 12px;border-radius:10px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px}
</style>
</head>
<body>
<div id="root"></div>
<script>window.addEventListener("error",function(e){var r=document.getElementById("root");if(r&&!r.childElementCount)r.innerHTML="<p style=\"padding:24px;color:#b3261e;font-size:14px\">読み込みに失敗しました："+(e.message||"")+"<br>電波の良い場所で再読み込みしてください。</p>";});</script>
