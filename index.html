<script>

const cutoffDate = (date, bldg) => { const [h, m] = WAIT_UNTIL[bldg].split(":").map(Number); const d = new Date(date + "T00:00:00"); d.setHours(h, m + 1, 0, 0); return d; };

}
const LOADED = ["積込後 残なし"]; // 「積込完了フロア」に数える状態

const { useState, useEffect, useRef, useCallback, useMemo } = React;

function emptyDay() {
    const trucks = {};

    const floors = {};

const isPlain = o => o && typeof o === "object" && o.constructor === Object;
function deepMerge(a, b) {

const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };

const shift = (d, n) => { const x = new Date(d + "T00:00:00"); x.setDate(x.getDate() + n); return x.toLocaleDateString("sv-SE"); };
const curHalf = () => new Date().getHours() < SWITCH_HOUR ? "am" : "pm";

        return half === "am" ? [date, "pm"] : [shift(date, 1), "am"];

// 先月の1日（これより前＝先々月以前は表示も入力もしない・自動で削除する）

const nowHM = () => new Date().toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
function useDay(date, user) {
    const [data, setData] = useState(null);

        setData(null);

            if (!user)
                return;

                setData(deepMerge(emptyDay(), snap.data() || {}));
